<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #0b0b0d;
    --surface: #fff0;
    --card: #161619;
    --card-2: #202024;
    --line: rgba(255,255,255,0.08);
    --track: rgba(255,255,255,0.10);
    --text: #f5f5f3;
    --text-dim: #8c8c93;
    --text-faint: #5c5c62;
    --accent: #00e5a0;
    --accent-ink: #052b20;
    --accent-dim: rgba(0,229,160,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  [data-theme="light"] {
    --bg: #e9e8e3;
    --card: #ffffff;
    --card-2: #f3f2ed;
    --line: rgba(0,0,0,0.07);
    --track: rgba(0,0,0,0.10);
    --text: #1a1a16;
    --text-dim: #6c6c63;
    --text-faint: #a2a299;
    --accent: #00aa7a;
    --accent-ink: #ffffff;
    --accent-dim: rgba(0,170,122,0.14);
    --shadow: 0 8px 22px rgba(0,0,0,0.13);
  }
  @keyframes eq { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
</style>
</helmet>
<div style="{{ themeVars }}"><div data-screen-label="Motorcycle HUD" style="width:880px;height:400px;background:var(--bg);line-height:normal;color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-feature-settings:'tnum' 1;padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;transition:background .35s ease,color .35s ease;">

  <!-- STATUS BAR -->
  <div style="display:flex;align-items:center;height:36px;flex:none;">
    <div style="flex:1;display:flex;align-items:center;gap:9px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="6.9" y2="6.9"/><line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="17.1" y2="6.9"/><line x1="6.9" y1="17.1" x2="5.2" y2="18.8"/></svg>
      <span style="font-size:18px;font-weight:500;letter-spacing:-.01em;">18°</span>
      <span style="font-size:13px;color:var(--text-dim);font-weight:400;">Clear · feels 16°</span>
    </div>
    <div style="flex:0;display:flex;align-items:baseline;gap:2px;white-space:nowrap;">
      <span style="font-size:26px;font-weight:600;letter-spacing:-.02em;">14:32</span>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:14px;">
      <div style="position:relative;display:flex;align-items:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <span style="position:absolute;top:-5px;right:-7px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;">3</span>
      </div>
      <!-- day/night toggle -->
      <div style="display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:2px;">
        <button onClick="{{ setLight }}" aria-label="Day" style="{{ lightSeg }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="3" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21"/><line x1="3" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="7" y2="7"/><line x1="17" y1="17" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="17" y2="7"/><line x1="7" y1="17" x2="5.6" y2="18.4"/></svg>
        </button>
        <button onClick="{{ setDark }}" aria-label="Night" style="{{ darkSeg }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A7.5 7.5 0 1 1 9.5 4a6 6 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN ROW -->
  <div style="flex:1;display:flex;gap:16px;align-items:stretch;min-height:0;">

    <!-- NAVIGATION CARD -->
    <div style="width:236px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;transition:background .35s ease;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.8s ease-in-out infinite;"></span>
        <span style="font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--text-dim);">NAVIGATING</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:14px;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21v-9a4 4 0 0 1 4-4h5"/><path d="M13.5 4.5 18 8l-4.5 3.5"/></svg>
        <div style="display:flex;flex-direction:column;">
          <span style="font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em;">400<span style="font-size:18px;font-weight:500;color:var(--text-dim);margin-left:3px;">m</span></span>
        </div>
      </div>
      <div style="margin-top:14px;">
        <div style="font-size:19px;font-weight:600;letter-spacing:-.01em;">Turn right</div>
        <div style="font-size:14px;color:var(--text-dim);margin-top:2px;">onto Market Street</div>
      </div>
      <div style="margin-top:10px;font-size:13px;color:var(--text-faint);">then continue 2.1 km</div>
      <div style="flex:1;"></div>
      <div style="display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--text-dim);">
        <span style="color:var(--text);font-weight:500;">14:58</span>
        <span style="opacity:.4;">·</span><span>12 min</span>
        <span style="opacity:.4;">·</span><span>8.4 km</span>
      </div>
    </div>

    <!-- SPEEDOMETER HERO -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;">
      <div style="position:relative;width:262px;height:240px;">
        <svg width="262" height="262" viewBox="0 0 262 262" style="position:absolute;top:0;left:0;">
          <circle cx="131" cy="131" r="112" fill="none" stroke="var(--track)" stroke-width="15" stroke-linecap="round" stroke-dasharray="527.79 703.72" transform="rotate(135 131 131)"/>
          <circle cx="131" cy="131" r="112" fill="none" stroke="var(--accent)" stroke-width="15" stroke-linecap="round" stroke-dasharray="211.12 703.72" transform="rotate(135 131 131)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <span style="font-size:88px;font-weight:600;line-height:.9;letter-spacing:-.04em;">72</span>
          <span style="font-size:15px;font-weight:500;letter-spacing:.18em;color:var(--text-dim);margin-top:4px;white-space:nowrap;">KM / H</span>
        </div>
        <span style="position:absolute;left:30px;bottom:30px;font-size:12px;color:var(--text-faint);">0</span>
        <span style="position:absolute;right:28px;bottom:30px;font-size:12px;color:var(--text-faint);">180</span>
      </div>
      <div style="display:flex;align-items:center;gap:18px;margin-top:2px;font-size:13px;color:var(--text-dim);">
        <span><span style="color:var(--text-faint);letter-spacing:.1em;">TRIP </span><span style="color:var(--text);font-weight:500;">142.0 km</span></span>
        <span style="width:1px;height:14px;background:var(--line);"></span>
        <span><span style="color:var(--text-faint);letter-spacing:.1em;">AVG </span><span style="color:var(--text);font-weight:500;">64</span></span>
        <span style="width:1px;height:14px;background:var(--line);"></span>
        <span><span style="color:var(--text-faint);letter-spacing:.1em;">ODO </span><span style="color:var(--text);font-weight:500;">18 402</span></span>
      </div>
    </div>

    <!-- MUSIC CARD -->
    <div style="width:236px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;transition:background .35s ease;">
      <div style="display:flex;align-items:center;gap:8px;height:14px;">
        <div style="display:flex;align-items:flex-end;gap:2px;height:12px;">
          <span style="width:3px;height:12px;background:var(--accent);border-radius:2px;transform-origin:bottom;animation:eq 0.9s ease-in-out infinite;"></span>
          <span style="width:3px;height:12px;background:var(--accent);border-radius:2px;transform-origin:bottom;animation:eq 0.9s ease-in-out infinite .3s;"></span>
          <span style="width:3px;height:12px;background:var(--accent);border-radius:2px;transform-origin:bottom;animation:eq 0.9s ease-in-out infinite .15s;"></span>
        </div>
        <span style="font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--text-dim);white-space:nowrap;">NOW PLAYING</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:14px;">
        <div style="width:54px;height:54px;flex:none;border-radius:13px;overflow:hidden;background:var(--card-2);background-image:repeating-linear-gradient(135deg,var(--line) 0,var(--line) 1px,transparent 1px,transparent 7px);display:flex;align-items:center;justify-content:center;">
          <span style="font-family:ui-monospace,monospace;font-size:8px;color:var(--text-faint);letter-spacing:.05em;">ART</span>
        </div>
        <div style="min-width:0;">
          <div style="font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Open Highway</div>
          <div style="font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;">The Wends</div>
        </div>
      </div>
      <div style="margin-top:14px;">
        <div style="height:4px;border-radius:3px;background:var(--track);overflow:hidden;">
          <div style="width:38%;height:100%;border-radius:3px;background:var(--accent);"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-faint);font-family:ui-monospace,monospace;">
          <span>1:24</span><span>3:40</span>
        </div>
      </div>
      <div style="flex:1;"></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
        <button aria-label="Previous" style="width:46px;height:46px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 6.5v11a.6.6 0 0 1-.95.49L9.5 12.6V17a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0v4.4l7.55-5.39A.6.6 0 0 1 18 6.5z"/></svg>
        </button>
        <button aria-label="Play" style="width:62px;height:62px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px var(--accent-dim);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.7.7 0 0 0 1.07.6l10.5-6.8a.7.7 0 0 0 0-1.2L9.07 4.6A.7.7 0 0 0 8 5.2z"/></svg>
        </button>
        <button aria-label="Next" style="width:46px;height:46px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6.5v11a.6.6 0 0 0 .95.49l7.55-5.39V17a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0v4.4L6.95 6.01A.6.6 0 0 0 6 6.5z"/></svg>
        </button>
      </div>
    </div>

  </div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:400}}">
class Component extends DCLogic {
  state = { theme: 'dark' };
  renderVals() {
    const t = this.state.theme;
    const dark = { '--bg':'#0b0b0d','--card':'#161619','--card-2':'#202024','--line':'rgba(255,255,255,0.08)','--track':'rgba(255,255,255,0.10)','--text':'#f5f5f3','--text-dim':'#8c8c93','--text-faint':'#5c5c62','--accent':'#00e5a0','--accent-ink':'#052b20','--accent-dim':'rgba(0,229,160,0.14)','--shadow':'0 10px 30px rgba(0,0,0,0.45)' };
    const light = { '--bg':'#e9e8e3','--card':'#ffffff','--card-2':'#f3f2ed','--line':'rgba(0,0,0,0.07)','--track':'rgba(0,0,0,0.10)','--text':'#1a1a16','--text-dim':'#6c6c63','--text-faint':'#a2a299','--accent':'#00aa7a','--accent-ink':'#ffffff','--accent-dim':'rgba(0,170,122,0.14)','--shadow':'0 8px 22px rgba(0,0,0,0.13)' };
    const base = { display:'flex', alignItems:'center', justifyContent:'center', width:'40px', height:'30px', borderRadius:'9px', border:'none', cursor:'pointer', transition:'background .25s ease, color .25s ease' };
    const on = { background:'var(--accent)', color:'var(--accent-ink)' };
    const off = { background:'transparent', color:'var(--text-dim)' };
    return {
      theme: t,
      themeVars: { display:'inline-block', lineHeight:0, ...(t === 'light' ? light : dark) },
      setDark: () => this.setState({ theme: 'dark' }),
      setLight: () => this.setState({ theme: 'light' }),
      lightSeg: { ...base, ...(t === 'light' ? on : off) },
      darkSeg: { ...base, ...(t === 'dark' ? on : off) },
    };
  }
}
</script>
</body>
</html>
